[project]
name = "vacancies-searcher"
version = "0.1.0"
description = "Local finder for jobs, residencies, open calls and grants that fit a creative professional's portfolio"
requires-python = ">=3.13"
dependencies = [
    "dateparser>=1.4.3",
    "fastapi>=0.142.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "jinja2>=3.1.6",
    "lingua-language-detector>=2.2.0",
    "markdown>=3.11",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-jobspy>=1.1.80",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=0.4.13",
    "tomlkit>=0.15.1",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vs = "vs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vs"]

[tool.uv]
# python-jobspy pins numpy==1.26.3, which has no Python 3.13 build; it only
# uses numpy through pandas, so a current numpy works.
override-dependencies = ["numpy>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
